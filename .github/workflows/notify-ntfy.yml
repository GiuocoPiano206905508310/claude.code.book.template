name: Notify ntfy (task completion)

# Claude Code → GitHub Actions → ntfy.sh → iPhone
# このサンドボックス環境からntfy.shへ直接アクセスすると403になるため、
# GitHub Actions経由で通知を送るための専用workflow。
# Claude CodeのブランチからのPull Request作成時に自動通知。
# 手動実行(workflow_dispatch)も引き続き可能。
# 他のworkflow・アプリのコードには一切影響しない、独立したworkflow。

on:
  pull_request:
    types: [opened]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'claude/')
    steps:
      - name: Send ntfy notification
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$NTFY_TOPIC_URL" ]; then
            echo "::error::NTFY_TOPIC_URL secret is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            MESSAGE="Claude Code のPull Requestが作成されました"
          else
            MESSAGE="Claude Codeのタスクが完了しました"
          fi

          curl -sS \
            -H "Title: Claude Code" \
            -H "Tags: white_check_mark" \
            -d "$MESSAGE" \
            "$NTFY_TOPIC_URL"
