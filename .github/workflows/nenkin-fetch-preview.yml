name: Nenkin fetch preview (manual, diagnostic only)

# TEMPORARY: 労働局サイトの構造診断に一時的に流用中。PR作成前に元に戻す。

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: sharoushi_news
        run: flutter pub get

      - name: Run roudoukyoku diagnostic
        working-directory: sharoushi_news
        run: dart run tool/roudoukyoku_diag.dart

      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sharoushi_news/diag/roudoukyoku.md
          git commit -m "diag: roudoukyoku page structure (temporary)"
          git push
