name: Nenkin fetch preview (manual, diagnostic only)

# TEMPORARY: 厚労省サイトの記事選定の診断に一時的に流用中。PR作成前に元に戻す。

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: sharoushi_news
        run: flutter pub get

      - name: Run MHLW diagnostic
        working-directory: sharoushi_news
        run: dart run tool/mhlw_diag.dart

      - name: Inspect the shift-work PDF
        working-directory: sharoushi_news
        run: |
          sudo apt-get install -y -q poppler-utils > /dev/null
          curl -sSL -A 'SharoushiNewsApp-Prototype/0.1 (individual use; not for redistribution)' -o shift.pdf https://www.mhlw.go.jp/content/11200000/001756191.pdf
          {
            echo; echo '## PDF 001756191'; echo '```'
            pdfinfo -meta shift.pdf | grep -i -E 'date|xmp:|CreationDate|ModDate' || true
            echo '--- wayback pdf'
            curl -sS -m 60 'https://web.archive.org/cdx/search/cdx?url=mhlw.go.jp/content/11200000/001756191.pdf&output=txt&limit=5' || true
            echo '--- wayback page 2026'
            curl -sS -m 60 'https://web.archive.org/cdx/search/cdx?url=mhlw.go.jp/stf/newpage_22954.html&output=txt&from=202606&fl=timestamp,digest,length&collapse=digest' || true
            echo '--- snapshots containing the leaflet'
            for ts in $(curl -sS -m 60 'https://web.archive.org/cdx/search/cdx?url=mhlw.go.jp/stf/newpage_22954.html&from=202606&fl=timestamp&collapse=digest' || true); do
              if curl -sS -m 60 "https://web.archive.org/web/${ts}id_/https://www.mhlw.go.jp/stf/newpage_22954.html" | grep -q 001756191; then echo "$ts has"; else echo "$ts lacks"; fi
              sleep 2
            done
            echo '```'
          } >> diag/mhlw.md

      - name: Commit diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f sharoushi_news/diag/mhlw.md
          git commit -m "diag: mhlw article selection (temporary)"
          git push
