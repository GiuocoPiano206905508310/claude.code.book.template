name: Deploy Pages site (incl. sharoushi_news)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: sharoushi_news
        run: flutter pub get

      - name: Build web
        working-directory: sharoushi_news
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/SharoushiNews/"

      # The rest of the repo (payroll simulator at the root, roumu-news, timeclock,
      # etc.) is served as-is; the Flutter build is placed under /SharoushiNews/
      # so this deployment doesn't replace the other apps already on Pages.
      - name: Assemble Pages site
        run: |
          SITE_DIR="${{ runner.temp }}/site"
          mkdir -p "$SITE_DIR"
          rsync -a --exclude='.git' --exclude='.github' --exclude='sharoushi_news' ./ "$SITE_DIR/"
          mkdir -p "$SITE_DIR/SharoushiNews"
          cp -r sharoushi_news/build/web/. "$SITE_DIR/SharoushiNews/"
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
