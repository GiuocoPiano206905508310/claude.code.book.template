name: Sharoushi News daily feed

# 毎日決まった時刻にMHLW・日本年金機構のサイトを取得し（RSSは使わず、
# 通常のHTTP GET+HTMLパースのみ）、結果をsharoushi-news-feed/articles.json
# としてmainへコミットする。
#
# 1日5回（JST 6:00・9:00・12:00・15:00・18:00）実行する。公開リポジトリの
# ためActionsの実行自体は無料であり、Claude API（Haiku 4.5）の呼び出しは
# 新規記事の件数に応じて発生する仕組み（tool/fetch_daily_feed.dartの
# canReuse判定）のため、回数を増やしても費用はほぼ増加しない。
#
# 注意: デフォルトのGITHUB_TOKENでのpushは、ループ防止のためGitHub側で
# 他のworkflowのpushトリガーを起動しない仕様になっている。そのため、
# deploy-sharoushi-news-pages.yml（GitHub Pagesへの公開）は自動連鎖せず、
# 最後のステップで明示的にworkflow_dispatchとして呼び出している。
#
# ANTHROPIC_API_KEY（Settings > Secrets and variables > Actions）が設定
# されていれば、新規記事のみClaude Haiku 4.5で概要・実務影響・重要ポイント
# を生成する。未設定でもジョブは失敗せず、汎用の案内文にフォールバックする。

on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST
    - cron: '0 0 * * *'  # 09:00 JST
    - cron: '0 3 * * *'  # 12:00 JST
    - cron: '0 6 * * *'  # 15:00 JST
    - cron: '0 9 * * *'  # 18:00 JST
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: sharoushi-news-daily-feed
  cancel-in-progress: false

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: sharoushi_news
        run: flutter pub get

      - name: Fetch daily feed
        working-directory: sharoushi_news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: dart run tool/fetch_daily_feed.dart

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sharoushi-news-feed/articles.json sharoushi-news-feed/watched_pages.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "sharoushi_news: update daily feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-sharoushi-news-pages.yml --ref main
