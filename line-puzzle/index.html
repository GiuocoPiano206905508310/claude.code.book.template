<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6e747c">
<title>ラインパズル</title>
<link rel="stylesheet" href="style.css?v=3b53ff344b">
</head>
<body>

<!-- ============ モノクロアイコン定義 ============ -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- ↪️ やり直す -->
    <symbol id="ic-retry" viewBox="0 0 24 24">
      <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/>
      <polyline points="3.2,4.2 3.2,10 9,10"/>
    </symbol>
    <!-- ⏸️ 中断 -->
    <symbol id="ic-pause" viewBox="0 0 24 24">
      <rect x="7" y="5" width="3.4" height="14" rx="1.3"/>
      <rect x="13.6" y="5" width="3.4" height="14" rx="1.3"/>
    </symbol>
    <!-- 💡 ヒント -->
    <symbol id="ic-hint" viewBox="0 0 24 24">
      <path d="M9 17.5h6"/>
      <path d="M10 20.5h4"/>
      <path d="M12 2.8a6.2 6.2 0 0 0-3.6 11.25c.5.36.8.93.8 1.55v.4h5.6v-.4c0-.62.3-1.19.8-1.55A6.2 6.2 0 0 0 12 2.8Z"/>
    </symbol>
    <symbol id="ic-back" viewBox="0 0 24 24"><polyline points="14.5,5 7.5,12 14.5,19"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5.2 18 12 8 18.8Z"/></symbol>
    <symbol id="ic-grid" viewBox="0 0 24 24">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
    </symbol>
    <symbol id="ic-lock" viewBox="0 0 24 24">
      <rect x="4.8" y="10.5" width="14.4" height="10" rx="2.2"/>
      <path d="M8.2 10.5V7.6a3.8 3.8 0 0 1 7.6 0v2.9"/>
    </symbol>
    <symbol id="ic-star" viewBox="0 0 24 24">
      <path d="m12 3.1 2.75 5.57 6.15.9-4.45 4.33 1.05 6.12L12 17.13 6.5 20.02l1.05-6.12L3.1 9.57l6.15-.9Z"/>
    </symbol>
    <!-- 👤 アカウント -->
    <symbol id="ic-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8.2" r="3.9"/>
      <path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/>
    </symbol>
    <!-- ❔ 遊び方 -->
    <symbol id="ic-help" viewBox="0 0 24 24">
      <path d="M8.7 9.2a3.4 3.4 0 1 1 5.2 2.9c-1 .65-1.9 1.25-1.9 2.55v.35"/>
      <circle cx="12" cy="18.3" r="1.05" fill="currentColor" stroke="none"/>
    </symbol>
          </defs>
</svg>

<!-- ============ ログイン / 新規登録 ============ -->
<section id="screen-login" class="screen screen-login">
  <div class="login-wrap">
    <h1 class="login-title">ラインパズル</h1>
    <p class="login-lede">アカウントを作ると、進行状況がどの端末からでも続けられます。</p>

    <div class="login-tabs" role="tablist">
      <button class="login-tab is-on" id="tab-login" type="button" role="tab" aria-selected="true">ログイン</button>
      <button class="login-tab" id="tab-signup" type="button" role="tab" aria-selected="false">新規登録</button>
    </div>

    <form class="login-card" id="form-login" novalidate>
      <label class="fld">
        <span>メールアドレス</span>
        <input type="email" id="login-email" autocomplete="email" inputmode="email" placeholder="you@example.com">
      </label>
      <label class="fld">
        <span>パスワード</span>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="6文字以上">
      </label>
      <p class="login-msg" id="login-msg" hidden></p>
      <button class="btn btn-primary btn-block" id="do-login" type="submit">ログイン</button>
      <button class="linkish" id="do-reset" type="button">パスワードを忘れた</button>
    </form>

    <form class="login-card" id="form-signup" novalidate hidden>
      <label class="fld">
        <span>ユーザー名</span>
        <input type="text" id="signup-username" autocomplete="nickname" maxlength="20" placeholder="2〜20文字">
      </label>
      <label class="fld">
        <span>メールアドレス</span>
        <input type="email" id="signup-email" autocomplete="email" inputmode="email" placeholder="you@example.com">
      </label>
      <label class="fld">
        <span>パスワード</span>
        <input type="password" id="signup-password" autocomplete="new-password" placeholder="6文字以上">
      </label>
      <p class="login-msg" id="signup-msg" hidden></p>
      <button class="btn btn-primary btn-block" id="do-signup" type="submit">登録して始める</button>
    </form>

    <button class="linkish linkish-guest" id="play-guest" type="button">ログインせずに遊ぶ</button>
  </div>
</section>

<!-- ============ ステージ選択画面 ============ -->
<section id="screen-select" class="screen">
  <header class="topbar">
    <div class="topbar-title">
      <span class="topbar-user" id="select-user">ラインパズル</span>
      <span id="select-progress" class="topbar-sub"></span>
    </div>
    <button class="icon-btn" id="select-account" type="button" aria-label="アカウント">
      <svg class="ic"><use href="#ic-user"/></svg>
    </button>
    <button class="icon-btn" id="select-help" type="button" aria-label="遊び方">
      <svg class="ic"><use href="#ic-help"/></svg>
    </button>
    <button class="icon-btn" id="select-continue" type="button" aria-label="つづきのステージへ">
      <svg class="ic"><use href="#ic-play"/></svg>
    </button>
  </header>
  <div class="stage-scroll">
    <ul id="stage-grid" class="stage-grid"></ul>
    <!-- 裏ステージ: 本編50ステージをすべてクリアすると中身が入る -->
    <section id="ura-section" class="ura-section" hidden>
      <p class="ura-head"><span>裏ステージ</span></p>
      <div id="ura-locked" class="ura-locked">
        <svg class="ic"><use href="#ic-lock"/></svg>
        <span>50ステージすべてクリアで解放されます</span>
      </div>
      <ul id="ura-grid" class="stage-grid" hidden></ul>
    </section>
  </div>
</section>

<!-- ============ ゲーム画面 ============ -->
<section id="screen-game" class="screen">
  <header class="topbar game-topbar">
    <button class="icon-btn" id="game-back" type="button" aria-label="ステージ選択へ">
      <svg class="ic"><use href="#ic-grid"/></svg>
    </button>
    <div class="action-btns">
      <button class="round-btn" id="game-help" type="button" aria-label="遊び方">
        <svg class="ic"><use href="#ic-help"/></svg>
      </button>
      <button class="round-btn" id="btn-hint" type="button" aria-label="ヒントを見る">
        <svg class="ic"><use href="#ic-hint"/></svg>
        <span class="badge" id="hint-badge">0</span>
      </button>
    </div>
    <button class="icon-btn" id="btn-pause" type="button" aria-label="中断する">
      <svg class="ic"><use href="#ic-pause"/></svg>
    </button>
  </header>

  <div class="level-row">
    <div class="level-plate">
      <span id="level-label">Level 1</span>
    </div>
  </div>

  <div class="stat-row">
    <span class="stat"><b id="stat-moves">0</b> 手</span>
    <span class="stat-sep"></span>
    <span class="stat">最短 <b id="stat-best">-</b> 手</span>
    <span class="stat-sep"></span>
    <span class="stat">残り <b id="stat-left">0</b> マス</span>
  </div>

  <div class="board-area">
    <div id="board-frame" class="board-frame">
      <div id="board" class="board"></div>
      <div id="hint-arrow" class="hint-arrow" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 3.5v17M12 3.5 5.5 10M12 3.5 18.5 10"/></svg>
      </div>
      <div id="player-stretch" class="player-stretch"></div>
    </div>
  </div>

  <!-- やり直すは親指の届く画面右下、案内文と同じ行の右端に置く -->
  <div class="howto-row">
    <p class="howto">スワイプで移動</p>
    <button class="round-btn" id="btn-retry" type="button" aria-label="やり直す">
      <svg class="ic"><use href="#ic-retry"/></svg>
    </button>
  </div>
</section>

<!-- ============ 中断モーダル ============ -->
<div id="modal-pause" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pause-title">
    <h2 id="pause-title" class="modal-title">中断中</h2>
    <p class="modal-text">進行状況はクリア時に自動保存されます。</p>
    <button class="btn btn-primary btn-block" id="pause-resume" type="button">つづける</button>
    <button class="btn btn-ghost btn-block" id="pause-restart" type="button">このステージをやり直す</button>
    <button class="btn btn-ghost btn-block" id="pause-select" type="button">ステージ選択へ</button>
  </div>
</div>

<!-- ============ 行き止まり（上下左右どこにも進めない） ============ -->
<div id="modal-stuck" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="stuck-title">
    <h2 id="stuck-title" class="modal-title">行き止まり</h2>
    <p class="modal-text">どこにも進めなくなりました。</p>
    <button class="btn btn-primary btn-block" id="stuck-restart" type="button">このステージをやり直す</button>
    <button class="btn btn-ghost btn-block" id="stuck-select" type="button">ステージ選択へ</button>
  </div>
</div>

<!-- ============ クリア演出 ============ -->
<div id="modal-clear" class="modal" hidden>
  <div class="modal-card clear-card" role="dialog" aria-modal="true" aria-labelledby="clear-title">
    <p class="clear-eyebrow">STAGE CLEAR</p>
    <h2 id="clear-title" class="modal-title">Level 1</h2>
    <div class="stars" id="clear-stars">
      <svg class="ic star"><use href="#ic-star"/></svg>
      <svg class="ic star"><use href="#ic-star"/></svg>
      <svg class="ic star"><use href="#ic-star"/></svg>
    </div>
    <p class="clear-detail" id="clear-detail"></p>
    <p class="saved-note"><span class="dot"></span>自動保存しました</p>
    <button class="btn btn-primary btn-block" id="clear-next" type="button">次のステージへ</button>
    <button class="btn btn-ghost btn-block" id="clear-retry" type="button">再チャレンジ</button>
    <button class="btn btn-ghost btn-block" id="clear-select" type="button">ステージ選択へ</button>
  </div>
</div>

<!-- ============ アカウント ============ -->
<div id="modal-account" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="account-title">
    <h2 id="account-title" class="modal-title">アカウント</h2>

    <div id="account-menu">
      <p class="modal-text" id="account-who"></p>
      <p class="modal-text account-sync" id="account-sync"></p>
      <div id="account-changes" class="account-changes">
        <button class="btn btn-ghost btn-block" id="account-name" type="button">ユーザー名を変更</button>
        <button class="btn btn-ghost btn-block" id="account-email" type="button">メールアドレスを変更</button>
        <button class="btn btn-ghost btn-block" id="account-password" type="button">パスワードを変更</button>
      </div>
      <button class="btn btn-primary btn-block" id="account-close" type="button">とじる</button>
      <button class="btn btn-ghost btn-block" id="account-login" type="button">ログイン / 新規登録</button>
      <button class="btn btn-ghost btn-block" id="account-logout" type="button">ログアウト</button>
    </div>

    <form id="account-form" novalidate hidden>
      <p class="modal-text account-sync" id="account-lede"></p>
      <label class="fld" id="account-field-1">
        <span id="account-label-1"></span>
        <input type="text" id="account-input-1">
      </label>
      <label class="fld" id="account-field-2">
        <span id="account-label-2"></span>
        <input type="password" id="account-input-2">
      </label>
      <label class="fld" id="account-field-3">
        <span id="account-label-3"></span>
        <input type="password" id="account-input-3">
      </label>
      <p class="login-msg" id="account-msg" hidden></p>
      <button class="btn btn-primary btn-block" id="account-save" type="submit">保存</button>
      <button class="btn btn-ghost btn-block" id="account-back" type="button">もどる</button>
    </form>
  </div>
</div>

<!-- ============ 遊び方チュートリアル ============ -->
<div id="modal-tutorial" class="modal" hidden></div>

<div id="toast" class="toast" hidden></div>

<script src="levels.js?v=2e1a4edec1"></script>
<script src="ura-levels.js?v=03ec45c424"></script>
<script src="cloud.js?v=f016a1df5c"></script>
<script src="game.js?v=87a4506930"></script>
</body>
</html>
