<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ブロック崩し</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #1e1e2e;
    color: #f0f0f0;
    font-family: sans-serif;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    margin-top: 12px;
    font-size: 18px;
  }
  canvas {
    background: #0f0f1a;
    display: block;
    margin-top: 8px;
    border: 2px solid #444;
  }
  #message {
    margin-top: 10px;
    font-size: 20px;
    min-height: 28px;
  }
</style>
</head>
<body>
  <h1>ブロック崩し</h1>
  <div id="hud">
    <span>スコア: <span id="score">0</span></span>
    <span>残機: <span id="lives">3</span></span>
  </div>
  <canvas id="game" width="480" height="320"></canvas>
  <div id="message"></div>
  <script src="main.js"></script>
</body>
</html>
