<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アカウント設定 | 給与・勤怠管理システム</title>
<script>(function(){try{var t=localStorage.getItem('themePreference');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<link rel="stylesheet" href="style.css?v=32">
</head>
<body>
<nav class="navbar" id="navbar"></nav>

<div class="page narrow">
  <header class="masthead">
    <p class="eyebrow">Account Settings</p>
    <h1>アカウント設定</h1>
    <div class="rule"></div>
  </header>

  <section class="card form-card" aria-label="パスワード変更">
    <h2>パスワード変更</h2>
    <div class="field-row">
      <label for="currentPassword">現在のパスワード</label>
      <div class="field-input"><input type="password" id="currentPassword" autocomplete="current-password"></div>
    </div>
    <div class="field-row">
      <label for="newPassword">新しいパスワード</label>
      <div class="field-input"><input type="password" id="newPassword" autocomplete="new-password"></div>
      <p class="field-note">※ 6文字以上で設定してください。</p>
    </div>
    <div class="field-row">
      <label for="newPasswordConfirm">新しいパスワード（確認）</label>
      <div class="field-input"><input type="password" id="newPasswordConfirm" autocomplete="new-password"></div>
    </div>
    <button type="button" class="btn btn-block" id="changePasswordBtn">パスワードを変更する</button>
    <p class="export-status" id="passwordStatus"></p>
  </section>

  <section class="card form-card" aria-label="画面の表示設定" style="margin-top:24px;">
    <h2>画面の表示設定</h2>
    <p class="field-note">※ この端末のブラウザにのみ保存されます。他の端末でログインした場合は別途設定してください。</p>
    <div class="checkbox-row">
      <input type="radio" name="themeChoice" id="themeSystem" value="system">
      <label for="themeSystem">自動（端末の設定に合わせる）</label>
    </div>
    <div class="checkbox-row">
      <input type="radio" name="themeChoice" id="themeLight" value="light">
      <label for="themeLight">白（ライト）</label>
    </div>
    <div class="checkbox-row">
      <input type="radio" name="themeChoice" id="themeDark" value="dark">
      <label for="themeDark">黒（ダーク）</label>
    </div>
  </section>

  <footer>個人・小規模事業向けの概算ツールです。</footer>
</div>

<script src="supabase-sdk.js?v=1"></script>
<script src="supabase-client.js?v=2"></script>
<script src="auth.js?v=3"></script>
<script src="common.js?v=16"></script>
<script src="account.js?v=2"></script>
</body>
</html>
