<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>労務ニュース便覧</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<div class="page narrow">
  <header class="news-header">
    <div class="news-header-top">
      <div class="news-brand">
        <p class="eyebrow">SR News Board</p>
        <h1>労務ニュース便覧</h1>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
        <button class="sync-btn" id="syncBtn" type="button">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M16 4v4h-4"/><path d="M4 16v-4h4"/><path d="M4.6 8.5A5.6 5.6 0 0 1 15 6.3M15.4 11.5A5.6 5.6 0 0 1 5 13.7"/></svg>
          <span id="syncLabel">最新の状態を確認</span>
        </button>
        <span style="font-size:11.5px; color:var(--ink-faint);" id="userLabel"></span>
      </div>
    </div>
    <p class="sync-meta" id="syncMeta">最終更新: 取得中…</p>

    <div class="news-tabs" role="tablist">
      <button class="news-tab" role="tab" id="tabLatest" aria-selected="true" type="button">最新情報 <span class="count" id="countLatest">0</span></button>
      <button class="news-tab" role="tab" id="tabFav" aria-selected="false" type="button">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="currentColor"><path d="M10 1.6l2.6 5.5 6 .7-4.4 4.1 1.2 6-5.4-3-5.4 3 1.2-6-4.4-4.1 6-.7z"/></svg>
        お気に入り <span class="count" id="countFav">0</span>
      </button>
    </div>

    <div class="news-filters" id="filters">
      <button class="news-chip" data-filter="all" aria-pressed="true" type="button">すべて</button>
      <button class="news-chip" data-filter="ministry" aria-pressed="false" type="button">省庁情報</button>
      <button class="news-chip" data-filter="news" aria-pressed="false" type="button">ニュース</button>
      <button class="news-chip" data-filter="pamphlet" aria-pressed="false" type="button">パンフレット</button>
      <button class="news-chip" data-filter="paid" aria-pressed="false" type="button">有料のみ</button>
    </div>
  </header>

  <main class="news-list" id="list" aria-live="polite"></main>

  <footer>厚生労働省・関係省庁等が公表する情報を取りまとめて表示する非公式のツールです。記事タップで各配信元サイトの元記事・パンフレットを新しいタブで開きます。記事内容の正確性は配信元サイトでご確認ください。</footer>

  <div class="news-toast" id="toast"></div>
</div>

<script src="supabase-sdk.js?v=1"></script>
<script src="supabase-client.js?v=1"></script>
<script src="auth.js?v=1"></script>
<script src="data.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
